name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --dev
      - name: ruff
        run: uv run ruff check --output-format=github .
      - name: black --check
        run: uv run black --check --diff .

  type:
    name: Type-check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --dev --extra pdf
      - run: uv run mypy

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # The pdf extra (WeasyPrint) is installed so the PDF export path is exercised by the
      # coverage gate. It is an offline install; the test suite still needs no network/API key.
      - run: uv sync --dev --extra pdf
      - name: pytest + coverage (gate 90%)
        run: >
          uv run pytest
          --cov=icep --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  determinism:
    name: Determinism (seed is byte-idempotent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --dev
      - name: re-seed and assert no diff in committed evidence
        run: |
          make seed-demo-data
          git diff --exit-code -- evidence/ \
            || { echo "::error::seed-demo-data is not reproducible (evidence/ changed)"; exit 1; }

  security:
    name: Security scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --dev
      - name: pip-audit (report-only)
        run: uv run pip-audit || true
