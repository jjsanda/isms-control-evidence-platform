# Statement of Applicability — PaketPort Systems GmbH (all 93 Annex A:2022 controls).
entries:
  - control_id: "A.5.1"
    applicable: true
    inclusion_reason: risk
    justification: "Top-level security policy sets PaketPort's direction and is required by ISO 27001 clause 5.2."
  - control_id: "A.5.2"
    applicable: true
    inclusion_reason: best_practice
    justification: "Clear security roles across locker ops, cloud and admin staff prevent accountability gaps."
  - control_id: "A.5.3"
    applicable: true
    inclusion_reason: risk
    justification: "Separating duties like firmware deploy from approval limits fraud and error in a small team."
  - control_id: "A.5.4"
    applicable: true
    inclusion_reason: best_practice
    justification: "Management actively requires staff to apply security controls for lockers and the backend."
  - control_id: "A.5.5"
    applicable: true
    inclusion_reason: legal
    justification: "As a NIS2 operator PaketPort must reach CERT.at, the DSB and police fast during incidents."
  - control_id: "A.5.6"
    applicable: true
    inclusion_reason: best_practice
    justification: "Membership in security forums keeps PaketPort current on threats to lockers and logistics IT."
  - control_id: "A.5.7"
    applicable: true
    inclusion_reason: risk
    justification: "Internet-facing lockers are constantly scanned, so threat intel guides defence of edge and APIs."
  - control_id: "A.5.8"
    applicable: true
    inclusion_reason: best_practice
    justification: "New locker rollouts and app features carry security requirements from design to go-live."
  - control_id: "A.5.9"
    applicable: true
    inclusion_reason: risk
    justification: "A live inventory of every locker, cloud service and PII store is vital for a dispersed estate."
  - control_id: "A.5.10"
    applicable: true
    inclusion_reason: best_practice
    justification: "Staff and contractors get clear rules for using PaketPort systems, data and locker tooling."
  - control_id: "A.5.11"
    applicable: true
    inclusion_reason: best_practice
    justification: "Leavers and field technicians must return laptops, locker keys and maintenance devices."
  - control_id: "A.5.12"
    applicable: true
    inclusion_reason: risk
    justification: "Classifying customer PII, parcel events and carrier keys drives proportionate protection."
  - control_id: "A.5.13"
    applicable: true
    inclusion_reason: best_practice
    justification: "Consistent labels let staff handle classified customer and operational data correctly."
  - control_id: "A.5.14"
    applicable: true
    inclusion_reason: risk
    justification: "Parcel events and addresses moving between lockers, cloud and carriers must be encrypted."
  - control_id: "A.5.15"
    applicable: true
    inclusion_reason: risk
    justification: "Access to the backend, locker management plane and PII is restricted on need-to-know."
  - control_id: "A.5.16"
    applicable: true
    inclusion_reason: risk
    justification: "Every user, technician and service identity across lockers and cloud is uniquely managed."
