    applicable: true
    inclusion_reason: risk
    justification: "Passwords, keys and tokens for locker and cloud access are issued and stored securely."
  - control_id: "A.5.18"
    applicable: true
    inclusion_reason: risk
    justification: "Access rights are granted and revoked as staff and carrier partners join, move or leave."
  - control_id: "A.5.19"
    applicable: true
    inclusion_reason: contractual
    justification: "Reliance on carriers, cloud and hardware vendors means supplier security must be governed."
