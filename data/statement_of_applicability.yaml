    applicable: true
    inclusion_reason: risk
    justification: "Events from lockers, cloud and monitoring are triaged consistently to identify real incidents."
  - control_id: "A.5.26"
    applicable: true
    inclusion_reason: risk
    justification: "A defined response limits impact when a locker or backend service is compromised."
  - control_id: "A.5.27"
    applicable: true
    inclusion_reason: best_practice
    justification: "Post-incident lessons feed back to harden lockers and the cloud against recurrence."
