    applicable: true
    inclusion_reason: legal
    justification: "Licensing of software in lockers and the backend is tracked to avoid IP infringement."
  - control_id: "A.5.33"
    applicable: true
    inclusion_reason: legal
    justification: "Retention and integrity of contracts, logs and parcel evidence meet legal and evidential needs."
  - control_id: "A.5.34"
    applicable: true
