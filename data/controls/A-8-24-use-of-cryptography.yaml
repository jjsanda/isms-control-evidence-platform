# Control A.8.24 — Use of cryptography.
id: "A.8.24"
title: "Use of cryptography"
theme: technological
category: "Cryptography"
objective: >-
  Define and implement rules for the effective use of cryptography, including key management, to
  protect information.
owner:
  name: "Milan Novak"
  role: "Head of Platform & SRE"
  email: "milan.novak@paketport.example"
status: implemented
maturity: 3
applicable: true
inclusion_reason: risk
soa_justification: >-
  Encryption protects personal data in transit and at rest across lockers, the cloud and carrier
  APIs.
policy_refs: ["POL-CRYP"]
evidence_refs: ["EV-018"]
risk_refs: ["R-001", "R-009"]
nis2_areas: [cryptography]
implementation_notes: >-
  POL-CRYP mandates TLS 1.2+ (1.3 preferred) for all data in transit, AES-256 at rest for
  databases, backups and the message bus, and signed firmware and OTA images for the locker fleet.
  Keys are held in the cloud KMS/HSM with rotation and least-privilege access; the TLS and crypto
  configuration is evidenced in EV-018, and firmware signing underpins the tamper controls behind
  R-001.
last_review: 2026-03-08
next_review: 2027-03-08
audit_status: accepted
tags: ["cryptography", "tls"]
