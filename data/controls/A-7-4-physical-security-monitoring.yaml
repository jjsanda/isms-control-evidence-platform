nis2_areas: []
implementation_notes: >-
  Lockers carry door and enclosure tamper sensors that raise events to the backend; an unexpected
  opening of the service compartment generates an alert correlated with maintenance schedules, and
  a tamper-detection monitoring export (EV-014) evidences coverage and alert handling. Offices use
  CCTV and alarm monitoring, and alerts route into the same security triage process as logical
  events.
