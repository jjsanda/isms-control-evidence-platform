# Risk — credential theft via phishing.
id: "R-005"
title: "Credential theft via phishing"
description: >-
  Staff are targeted by phishing that harvests credentials or one-time codes, giving an attacker a
  foothold in corporate or backend systems from which to escalate.
owner:
  name: "Petra Klein"
  role: "HR Manager"
  email: "petra.klein@paketport.example"
asset: "Staff credentials"
threat: "Phishing and social-engineering campaigns against employees"
vulnerability: "Human susceptibility and any authentication paths not yet protected by phishing-resistant MFA"
inherent_likelihood: 4
inherent_impact: 4
treatment: mitigate
mitigation: >-
  Recurring security-awareness training and phishing simulations (A.6.3); rollout of MFA,
  preferring phishing-resistant factors, across staff and administrative access (A.8.5); and an
  easy, no-blame channel to report suspected phishing quickly.
control_refs: ["A.6.3", "A.8.5"]
residual_likelihood: 3
residual_impact: 3
target_date: 2026-09-30
review_date: 2027-03-15
acceptance: pending
