# NIS2 Directive (EU) 2022/2555 — Art. 21(2) risk-management measures (plus Art. 20) as
# implemented by PaketPort Systems GmbH, mapped to the ISO/IEC 27001:2022 Annex A controls.
measures:
  - area: risk_analysis
    article: "Art. 21(2)(a)"
    title: "Risk analysis and information system security policies"
    description: >-
      PaketPort operates a documented risk-management process and an approved information security
      policy set (A.5.1) covering the locker edge, the cloud backend and corporate IT. Risks are
      assessed on a transparent 5x5 likelihood-impact model, treated to defined criteria and
      reviewed, and the policies are approved by top management and reviewed at least annually.
    control_refs: ["A.5.1"]
  - area: incident_handling
    article: "Art. 21(2)(b)"
    title: "Incident handling"
    description: >-
      A prepared incident-management process (A.5.24), consistent triage of security events
      (A.5.25, A.6.8) and continuous monitoring (A.8.16) let PaketPort detect, classify and
      respond to incidents affecting lockers and the backend. The process is wired to the NIS2
      Art. 23 reporting timeline and rehearsed through tabletop exercises.
    control_refs: ["A.5.24", "A.5.25", "A.6.8", "A.8.16"]
  - area: business_continuity
    article: "Art. 21(2)(c)"
    title: "Business continuity, backup management and crisis management"
    description: >-
      ICT continuity is planned and tested (A.5.30) with cross-region failover and regularly
      exercised, encrypted backups (A.8.13) meeting a one-hour RPO and four-hour RTO for the
      backend. Lockers buffer transactions locally and reconcile on reconnection so that parcel
      handover keeps working during backend disruption.
    control_refs: ["A.5.30", "A.8.13"]
  - area: supply_chain
    article: "Art. 21(2)(d)"
    title: "Supply chain security"
    description: >-
      Supplier relationships are governed through due diligence, contractual security clauses and
      periodic reviews (A.5.19), ICT supply-chain and SBOM assessment of third-party components
      (A.5.21), and a hardened, monitored cloud configuration under the shared-responsibility
      model (A.5.23). This addresses risk from carriers, the cloud provider and hardware vendors.
    control_refs: ["A.5.19", "A.5.21", "A.5.23"]
  - area: acq_dev_maintenance
    article: "Art. 21(2)(e)"
    title: "Security in acquisition, development and maintenance"
    description: >-
      Security is built into acquisition, development and maintenance through vulnerability
      management with remediation SLAs (A.8.8), secure and version-controlled configuration
      baselines for the fleet and cloud (A.8.9), and secure coding with CI-based scanning (A.8.28)
      for the customer app and the locker firmware.
    control_refs: ["A.8.8", "A.8.9", "A.8.28"]
  - area: effectiveness
    article: "Art. 21(2)(f)"
    title: "Policies to assess the effectiveness of risk-management measures"
    description: >-
      The effectiveness of security measures is assessed through an independent internal audit
      programme and top-management review (A.5.35), whose findings feed the corrective-action
      (CAPA) backlog. Metrics on control status, evidence freshness and residual-risk posture
      support continual improvement of the ISMS.
    control_refs: ["A.5.35"]
  - area: cyber_hygiene_training
    article: "Art. 21(2)(g)"
    title: "Basic cyber hygiene practices and security training"
    description: >-
      All staff and field technicians complete recurring security-awareness training and a graded
      quiz (A.6.3) covering phishing, MFA, device and locker security and personal-data handling.
      Curated threat intelligence (A.5.7) keeps the hygiene guidance and technical defences
      current against threats to internet-facing lockers.
    control_refs: ["A.6.3", "A.5.7"]
  - area: cryptography
    article: "Art. 21(2)(h)"
    title: "Cryptography and, where appropriate, encryption"
    description: >-
      A cryptography policy (A.8.24) mandates TLS 1.2+ (1.3 preferred) for data in transit,
      AES-256 at rest for databases and backups, signed firmware and OTA images for the lockers,
      and centralised key management with rotation. Encryption protects customers' personal data
      across the locker-to-backend and carrier-API paths.
    control_refs: ["A.8.24"]
  - area: hr_access_asset
    article: "Art. 21(2)(i)"
    title: "Human resources security, access control and asset management"
    description: >-
      Human-resources security, access control and asset management are covered by a maintained
      asset inventory with named owners (A.5.9), least-privilege access control on a need-to-know
      basis (A.5.15) and tightly managed privileged access (A.8.2). Access changes follow
      joiner-mover-leaver events and are reviewed quarterly.
    control_refs: ["A.5.9", "A.5.15", "A.8.2"]
  - area: mfa_comms
    article: "Art. 21(2)(j)"
    title: "Multi-factor authentication and secured communications"
    description: >-
      Multi-factor authentication is enforced and being extended across administrative, staff and
      edge-management access (A.8.5), and communications are secured through network segmentation,
      WAF and DDoS protection, and mutually authenticated TLS between the lockers and the backend
      (A.8.20).
    control_refs: ["A.8.5", "A.8.20"]
  - area: management_accountability
    article: "Art. 20"
    title: "Governance and management-body accountability"
    description: >-
      The management body, led by the Managing Director, approves the ISMS policy and
      risk-treatment decisions, allocates resources and oversees NIS2 compliance through
      management review (A.5.1). Senior management is accountable for the security measures and
      receives regular reporting on security posture and incidents.
    control_refs: ["A.5.1"]
